<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  O modelo do contrato usa Brandon Grotesque (fonte comercial, não vem no
  container). Sem este alias o LibreOffice cairia numa fonte qualquer; assim
  os títulos saem na Source Sans Pro, a mesma família do corpo do contrato.
-->
<fontconfig>
  <alias binding="same">
    <family>Brandon Grotesque Bold</family>
    <prefer><family>Source Sans Pro</family></prefer>
  </alias>
  <alias binding="same">
    <family>Brandon Grotesque Regular</family>
    <prefer><family>Source Sans Pro</family></prefer>
  </alias>
  <alias binding="same">
    <family>Brandon Grotesque</family>
    <prefer><family>Source Sans Pro</family></prefer>
  </alias>
</fontconfig>
